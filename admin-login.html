<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin – Sistem Ujian CBT</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #2563eb 100%); }

    .login-wrap {
      width: 100%; max-width: 420px; padding: 1rem;
    }

    .login-card {
      background: white; border-radius: 24px; padding: 3rem 2.5rem;
      box-shadow: 0 30px 80px rgba(0,0,0,0.3);
      position: relative; overflow: hidden;
    }
    .login-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px;
      background: linear-gradient(90deg, #2563eb, #4f46e5, #06b6d4);
    }

    .login-logo {
      text-align: center; margin-bottom: 2rem;
    }
    .login-logo-icon {
      width: 64px; height: 64px; background: linear-gradient(135deg, #eff6ff, #e0e7ff);
      border-radius: 16px; display: flex; align-items: center; justify-content: center;
      font-size: 1.75rem; margin: 0 auto 1rem;
      box-shadow: 0 4px 15px rgba(37,99,235,0.15);
    }
    .login-logo h1 { font-size: 1.35rem; color: #0f172a; margin-bottom: 2px; }
    .login-logo p { font-size: 0.8rem; color: #94a3b8; font-weight: 600; }

    .login-title { font-size: 1.5rem; font-weight: 800; color: #0f172a; margin-bottom: 0.25rem; }
    .login-subtitle { font-size: 0.875rem; color: #64748b; margin-bottom: 2rem; }

    .login-group { margin-bottom: 1.25rem; }
    .login-label { display: block; font-size: 0.82rem; font-weight: 700; color: #475569; margin-bottom: 6px; }
    .login-input {
      width: 100%; padding: 0.875rem 1rem; border: 1.5px solid #e2e8f0;
      border-radius: 12px; font-size: 0.95rem; font-family: 'Inter', sans-serif;
      transition: border-color 0.2s, box-shadow 0.2s; outline: none;
    }
    .login-input:focus { border-color: #2563eb; box-shadow: 0 0 0 4px rgba(37,99,235,0.1); }
    .login-input.error { border-color: #e11d48; box-shadow: 0 0 0 4px rgba(225,29,72,0.1); }

    .login-error {
      background: #fef2f2; border: 1px solid #fecaca; border-radius: 10px;
      padding: 0.75rem 1rem; font-size: 0.85rem; color: #991b1b;
      margin-bottom: 1.25rem; display: none; align-items: center; gap: 8px;
    }
    .login-error.show { display: flex; }

    .login-btn {
      width: 100%; padding: 1rem; background: linear-gradient(135deg, #1e3a8a, #2563eb);
      color: white; border: none; border-radius: 12px; font-size: 1rem;
      font-weight: 800; cursor: pointer; font-family: 'Inter', sans-serif;
      box-shadow: 0 4px 15px rgba(37,99,235,0.35);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(37,99,235,0.4); }
    .login-btn:active { transform: translateY(0); }

    .login-footer {
      text-align: center; margin-top: 1.5rem;
      font-size: 0.78rem; color: #94a3b8;
    }

    /* Background blobs */
    .blob {
      position: fixed; border-radius: 50%;
      filter: blur(80px); opacity: 0.15; pointer-events: none; z-index: 0;
    }
    .blob-1 { width: 400px; height: 400px; background: #60a5fa; top: -100px; left: -100px; }
    .blob-2 { width: 350px; height: 350px; background: #818cf8; bottom: -100px; right: -50px; }
  </style>
</head>
<body>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">🔐</div>
      <h1>CBT ADMIN</h1>
      <p>Sistem Ujian Seleksi Digital</p>
    </div>

    <div class="login-title">Masuk ke Panel Admin</div>
    <p class="login-subtitle">Masukkan kredensial Anda untuk melanjutkan.</p>

    <div class="login-error" id="login-error">
      <span>⚠️</span> Username atau password salah.
    </div>

    <form id="login-form" onsubmit="doLogin(event)">
      <div class="login-group">
        <label class="login-label" for="username">Username</label>
        <input type="text" id="username" class="login-input" placeholder="Masukkan username" autocomplete="username">
      </div>
      <div class="login-group">
        <label class="login-label" for="password">Password</label>
        <input type="password" id="password" class="login-input" placeholder="Masukkan password" autocomplete="current-password">
      </div>
      <button type="submit" class="login-btn">Masuk ke Dashboard →</button>
    </form>

    <div class="login-footer">
      © 2026 Sistem Ujian CBT – Seleksi Masuk Kerja
    </div>
  </div>
</div>

<script>
  // Cek jika sudah login
  if (sessionStorage.getItem('admin_logged_in') === 'true') {
    window.location.href = 'admin.html';
  }

  function doLogin(e) {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errEl = document.getElementById('login-error');
    const uInput = document.getElementById('username');
    const pInput = document.getElementById('password');

    // Reset
    errEl.classList.remove('show');
    uInput.classList.remove('error');
    pInput.classList.remove('error');

    if (username === 'admin' && password === 'admin1234') {
      sessionStorage.setItem('admin_logged_in', 'true');
      window.location.href = 'admin.html';
    } else {
      errEl.classList.add('show');
      uInput.classList.add('error');
      pInput.classList.add('error');
      pInput.value = '';
    }
  }
</script>
</body>
</html>
